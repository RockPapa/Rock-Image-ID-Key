<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dan’s Songs</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101b20;color:#f7f0e5}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:64px 24px}header{margin-bottom:36px}.eyebrow{color:#d8b575;text-transform:uppercase;letter-spacing:.22em;font-size:12px}h1{font-family:Georgia,serif;font-size:clamp(48px,9vw,82px);font-weight:400;margin:16px 0}p{color:#b4c3c8;line-height:1.6}.player{background:#1b2c33;border:1px solid #37505a;border-radius:20px;padding:28px;position:sticky;top:12px;z-index:2;box-shadow:0 16px 48px #0005}.label{color:#d8b575;font-size:12px;letter-spacing:.15em;text-transform:uppercase}h2{margin:10px 0 20px;font-size:24px}audio{width:100%;display:block;margin-bottom:20px}button,input{font:inherit}button{cursor:pointer;border:1px solid #526770;background:#233b45;color:#fff;border-radius:10px;min-height:46px;padding:10px 18px}button:hover{background:#345460}button:focus-visible,input:focus-visible{outline:3px solid #edc680;outline-offset:3px}.primary{background:#e6bd79;color:#16252b;border-color:#e6bd79;font-weight:700}.primary:hover{background:#f6d59e}.controls{display:flex;gap:10px;flex-wrap:wrap}.library{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:36px 0 16px;flex-wrap:wrap}.library h2{margin:0}input{background:#1b2c33;color:white;border:1px solid #526770;padding:12px 16px;border-radius:10px;width:min(100%,280px)}ol{list-style:none;margin:0;padding:0}li{border-bottom:1px solid #30424a}li button{display:flex;align-items:center;gap:18px;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:18px 10px}li button[aria-current=true]{background:#243f49;color:#f4ce8c}.number{font-size:13px;color:#9fb4bd;min-width:24px}.name{flex:1}.playword{font-size:14px;color:#e6bd79}footer{margin-top:30px;color:#94aab3;font-size:13px}#status{margin:12px 0 0;min-height:24px} @media(max-width:520px){main{padding:32px 16px}.player{padding:20px;position:static}.controls button{flex:1;padding:10px}.playword{font-size:12px}}
</style>
</head>
<body><main>
<header><div class="eyebrow">Original music · Dan Williams</div><h1>Dan’s Songs</h1><p>A collection of songs to settle into. Pick a favorite, or press Play All and enjoy the whole collection.</p></header>
<section class="player" aria-label="Music player"><div class="label">Now playing</div><h2 id="current">Choose a song</h2><audio id="audio" controls preload="none">Your browser does not support audio playback.</audio><div class="controls"><button id="all" class="primary">▶ Play All</button><button id="prev" aria-label="Previous song">← Previous</button><button id="next" aria-label="Next song">Next →</button></div><p id="status" role="status" aria-live="polite">Loading songs…</p></section>
<section aria-label="Song library"><div class="library"><h2 id="count">The collection</h2><input id="search" type="search" aria-label="Search songs" placeholder="Find a song…"></div><ol id="list"></ol></section><footer>Made for listening. Thanks for being here.</footer>
</main><script>
'use strict';
const audio=document.getElementById('audio'),list=document.getElementById('list'),status=document.getElementById('status'),current=document.getElementById('current'),search=document.getElementById('search');
let tracks=[],index=-1,continuous=false;
function render(){list.replaceChildren();const query=search.value.trim().toLowerCase();let shown=0;tracks.forEach((track,i)=>{if(!track.title.toLowerCase().includes(query))return;shown++;const li=document.createElement('li'),button=document.createElement('button');button.type='button';button.setAttribute('aria-current',String(i===index));button.setAttribute('aria-label','Play '+track.title);const n=document.createElement('span');n.className='number';n.textContent=String(i+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=track.title;const action=document.createElement('span');action.className='playword';action.textContent=i===index&&!audio.paused?'Playing':'▶ Play';button.append(n,name,action);button.onclick=()=>{continuous=false;select(i)};li.append(button);list.append(li)});document.getElementById('count').textContent=query?shown+' matching songs':tracks.length+' songs';}
async function select(i){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;current.textContent=tracks[index].title;audio.src=tracks[index].src.split('/').map(encodeURIComponent).join('/');status.textContent=(continuous?'Playing the collection · ':'Song ')+(index+1)+' of '+tracks.length;render();try{await audio.play()}catch(e){status.textContent='Tap the audio player’s Play button to start this song.'}}
document.getElementById('all').onclick=()=>{continuous=true;select(0)};
document.getElementById('prev').onclick=()=>select(index<0?0:index-1);
document.getElementById('next').onclick=()=>select(index<0?0:index+1);
audio.addEventListener('ended',()=>{if(continuous&&index+1<tracks.length)select(index+1);else{status.textContent=continuous?'The collection has finished. Press Play All to listen again.':'Song finished. Choose another song or press Play All.';continuous=false;render()}});
audio.addEventListener('play',render);audio.addEventListener('pause',render);audio.addEventListener('error',()=>{status.textContent='This song could not load. Try another song or check your connection.'});search.addEventListener('input',render);
fetch('playlist.json').then(r=>{if(!r.ok)throw Error('playlist');return r.json()}).then(data=>{tracks=data;render();status.textContent='Pick a song, or play all '+tracks.length+' in order.'}).catch(()=>{status.textContent='The song list could not load. Please refresh the page.'});
</script></body></html>
