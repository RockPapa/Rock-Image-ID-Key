    html,body{margin:0;min-height:100%;background:#2f61eb;color:white}
    button{font:inherit}
    main{width:min(760px,100%);min-height:100vh;margin:auto;padding:54px 28px 80px}
    h1{margin:0 0 48px;font-size:clamp(2.25rem,8vw,4rem);line-height:1.05;text-align:center}

    .region-button{min-height:62px;padding:9px 6px;border:3px solid white;border-radius:13px;background:#204dce;color:white;font-weight:850;font-size:clamp(.88rem,3vw,1.15rem);cursor:pointer}
    .region-button.active{background:white;color:#234fcf;box-shadow:0 4px 12px #12379499}
    .category h2{margin:0 0 22px;font-size:clamp(2rem,7vw,3.25rem);line-height:1.08;text-align:center}
    .species-list{display:grid;gap:12px;width:min(580px,100%);margin:auto}
    .species-button{min-height:68px;padding:12px 14px;border:3px solid #ffffff;border-radius:14px;background:#204dce;color:#fff;font-weight:800;font-size:clamp(1.05rem,4vw,1.35rem);cursor:pointer;box-shadow:0 4px 10px #12379488}
    .species-button:hover,.species-button:focus-visible{background:#fff;color:#234fcf;outline:4px solid #ffe56a;outline-offset:3px}
    .latin{display:block;margin-top:4px;font:italic 600 .78em Georgia,serif;opacity:.86}
    .flower-clue{display:block;margin:8px auto 0;color:#dce6ff;font-size:.68em;font-weight:600;line-height:1.25}
    .leaf-clue{display:block;margin:6px auto 0;padding-top:6px;border-top:1px solid #ffffff55;color:#d7f4df;font-size:.68em;font-weight:600;line-height:1.25}
    .clue-label{color:#fff0a6;font-weight:900;text-transform:uppercase;letter-spacing:.035em}
    .species-button:hover .flower-clue,.species-button:focus-visible .flower-clue{color:#3151a8}
    .species-button:hover .leaf-clue,.species-button:focus-visible .leaf-clue{color:#285e3d;border-top-color:#3151a855}
    .species-button:hover .clue-label,.species-button:focus-visible .clue-label{color:#8a5900}
    .empty{text-align:center;color:#d9e2ff;font-size:1rem;font-style:italic}
    .gallery-view{display:none}
    .gallery-view.active{display:block}
    .index-view.hidden{display:none}
    .topbar{position:sticky;z-index:5;top:0;display:flex;justify-content:flex-start;width:100%;margin:-18px 0 28px;padding:12px 0;background:#2f61ebee;backdrop-filter:blur(6px)}
    .back{min-height:46px;padding:8px 18px;border:2px solid white;border-radius:999px;background:#173f9d;color:white;font-weight:800;cursor:pointer}
    .gallery-title{margin:0;font-size:clamp(2.2rem,9vw,4.5rem);text-align:center}
    .gallery-latin{margin:8px 0 28px;font:italic clamp(1.1rem,4vw,1.45rem) Georgia,serif;text-align:center;color:#dfe8ff}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
    .gallery img{display:block;width:100%;height:330px;object-fit:contain;border-radius:14px;background:#153a9a;box-shadow:0 5px 18px #11307799}
    .flower-profile{max-width:620px;margin:0 auto 24px;color:#eef3ff;font-size:1.08rem;line-height:1.5;text-align:center}
    .no-images{grid-column:1/-1;padding:42px 20px;border:3px dashed #b8c9ff;border-radius:16px;color:#e1e9ff;font-size:1.1rem;text-align:center}
    .image-search-link{display:block;width:min(280px,90%);margin:20px auto 0;padding:12px 18px;border:3px solid white;border-radius:999px;background:#fff;color:#234fcf;font-weight:900;text-decoration:none}
    .image-search-link:hover,.image-search-link:focus-visible{outline:4px solid #ffe56a;outline-offset:3px;background:#204dce;color:white}
    .note{margin-top:45px;color:#d9e2ff;font-size:.85rem;text-align:center}
    @media(max-width:520px){main{padding:42px 18px 60px}.category{margin-bottom:58px}.gallery img{height:285px}}
  </style>
</head>

</main>

 'Rhus copallinum':{mountains:'Abundant',piedmont:'Abundant',coastal:'Abundant'},
 'Xanthorhiza simplicissima':{mountains:'Abundant',piedmont:'Occasional'},
 'Nestronia umbellula':{mountains:'Rare',piedmont:'Rare',coastal:'Rare'}
};
const index=document.getElementById('index');
const galleryView=document.getElementById('galleryView');
let selectedRegion='coastal';
let indexScrollPosition=0;
let selectedSpeciesIndex=null;
function renderSpecies(){document.getElementById('flowerGroups').innerHTML=groups.map(g=>{const matches=species.map((s,i)=>({s,i})).filter(x=>x.s.group===g[0]&&x.s.regions.includes(selectedRegion));if(!matches.length)return'';return`<section class="category"><h2>${g[1]}</h2><p class="empty">${g[2]}</p><div class="species-list">${matches.map(x=>`<button class="species-button" data-i="${x.i}">${x.s.name}<span class="latin">${x.s.latin}</span><span class="flower-clue"><span class="clue-label">Flowers:</span> ${x.s.flower}</span><span class="leaf-clue"><span class="clue-label">Leaves:</span> ${x.s.leaf}</span></button>`).join('')}</div></section>`}).join('');document.querySelectorAll('.species-button').forEach(button=>button.onclick=()=>showSpecies(species[+button.dataset.i],+button.dataset.i))}
document.querySelectorAll('.region-button').forEach(button=>button.onclick=()=>{selectedRegion=button.dataset.region;document.querySelectorAll('.region-button').forEach(b=>b.classList.toggle('active',b===button));renderSpecies()});
renderSpecies();
function showSpecies(s,speciesIndex){
  indexScrollPosition=window.scrollY;
  selectedSpeciesIndex=speciesIndex;
  document.getElementById('galleryTitle').textContent=s.name;
  document.getElementById('galleryLatin').textContent=s.latin;
  const regionalAbundance=abundance[s.latin]?.[selectedRegion]||'Not rated';
  document.getElementById('flowerProfile').innerHTML=`<strong>Flowers:</strong> ${s.flower}<br><strong>Leaves:</strong> ${s.leaf}<br><strong>Favored habitat:</strong> ${habitats[s.latin]||'Habitat information not yet available.'}<br><strong>Estimated field abundance:</strong> ${regionalAbundance}${s.calcium?`<br><strong>Calcium:</strong> ${s.calcium}`:''}`;
  const imageSearch=`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(`${s.name} ${s.latin} identification`)}`;
  document.getElementById('gallery').innerHTML=`<div class="no-images">${s.provisional?'Identity still needs confirmation. Use search results cautiously.':'Open photographs and identification examples in your browser.'}<a class="image-search-link" href="${imageSearch}" target="_blank" rel="noopener noreferrer">Browser Image Search</a></div>`;
  index.classList.add('hidden');
  galleryView.classList.add('active');
  window.scrollTo(0,0);
}
document.getElementById('back').onclick=()=>{
  galleryView.classList.remove('active');
  index.classList.remove('hidden');
  requestAnimationFrame(()=>{
    const selectedButton=document.querySelector(`.species-button[data-i="${selectedSpeciesIndex}"]`);
    if(selectedButton)selectedButton.focus({preventScroll:true});
    window.scrollTo(0,indexScrollPosition);
  });
};
document.getElementById('backBottom').onclick=()=>document.getElementById('back').click();
</script>
</body>
</html>
